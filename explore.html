
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISA | Explore Marketplace</title>
    <link rel="icon" type="image/png" href="assets/bisa-logo-mark.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <a href="index.html" class="logo site-brand" aria-label="BISA home"><img src="assets/bisa-logo-mark.png" alt=""><span>BISA<span class="brand-dot">.</span></span></a>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="explore.html" class="active">Explore</a>
            <a href="business.html">List Your Business</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="explore-page">
        <section class="explore-intro">
            <div>
                <p class="breadcrumb">HOME / EXPLORE</p>
                <h1>Explore</h1>
            </div>
        </section>

        <section class="market-search">
            <input type="search" placeholder="Search products, services or businesses..." aria-label="Search marketplace">
            <button type="button" class="btn btn-primary">Search</button>
        </section>

        <section class="marketplace-layout">
            <aside class="filter-panel">
                <h2>Filters</h2>

                <div class="filter-group">
                    <h3>Location</h3>
                    <label><input type="checkbox" name="location" value="campus"> Campus</label>
                    <label><input type="checkbox" name="location" value="nearby"> Nearby</label>
                </div>

                <button type="button" class="btn btn-outline full-button">Apply Filters</button>
            </aside>

            <section class="marketplace-listings">
                <div class="listings-heading">
                    <h2>Published businesses</h2>
                    <select aria-label="Sort listings">
                        <option>Featured</option>
                        <option>Newest</option>
                    </select>
                </div>

                <div class="listing-grid">
                    <p class="empty-state">Loading published businesses…</p>
                </div>
            </section>

        </section>
    </main>

    <footer class="footer">
        <a href="admin-login.html" class="footer-logo" aria-label="BISA"><img src="assets/bisa-logo-full.png" alt="BISA — Let's do business and share ideas"></a>
        <p>Find What You Need. Connect with Student Businesses.</p>
        <nav class="footer-nav" aria-label="Footer navigation">
            <a href="explore.html">Explore</a>
            <a href="business.html">List Your Business</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>
        <div class="footer-meta">
            <p class="copyright">&copy; 2026 BISA. All rights reserved.</p>
        </div>
    </footer>
    <script src="site-shell.js"></script>
    <script src="script.js"></script>
</body>
</html>
