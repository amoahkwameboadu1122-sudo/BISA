<script>
        // JS: Loads ONLY approved businesses from Supabase/cache and runs live search + category/location filtering
        (function () {
            const SUPABASE_URL = 'https://vrgbataasdiyyhtsmjsp.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_cJh3pYYwrQDqWPSNJJOdGg_oEjRqqkY';
            const sb = window.supabase && typeof window.supabase.createClient === 'function'
                ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
                : null;

            const CONFIG_KEY = 'bisa_admin_config_v1';
            const LS_SETTINGS_KEY = 'bisa_settings_cache';
            const LS_BUSINESSES_KEY = 'bisa_businesses_cache';
            const PENDING_NOTICE_KEY = 'bisa_pending_explore_notice';

            const connectPolicyModal = document.getElementById('connectPolicyModal');
            const contactModal = document.getElementById('contactModal');
            const cancelPolicyBtn = document.getElementById('cancelPolicyBtn');
            const agreePolicyBtn = document.getElementById('agreePolicyBtn');
            const closeContactModalBtn = document.getElementById('closeContactModalBtn');
            const doneContactModalBtn = document.getElementById('doneContactModalBtn');
            const resultsGrid = document.getElementById('exploreResultsGrid');
            const resultsCountLabel = document.getElementById('resultsCountLabel');

            const searchForm = document.getElementById('exploreSearchForm');
            const searchInput = document.getElementById('exploreSearchInput');
            const sortSelect = document.getElementById('exploreSortSelect');
            const applyFiltersBtn = document.getElementById('applyFiltersBtn');
            const clearFiltersBtn = document.getElementById('clearFiltersBtn');

            const slideshowWrap = document.getElementById('bizModalSlideshow');
            const slidesTrack = document.getElementById('bizModalSlides');
            const slidePrevBtn = document.getElementById('bizSlidePrev');
            const slideNextBtn = document.getElementById('bizSlideNext');
            const slideDotsWrap = document.getElementById('bizSlideDots');

            let approvedBusinesses = [];
            let selectedCardData = null;
            let currentSlides = [];
            let currentSlideIdx = 0;

            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = (urlParams.get('q') || '').trim();
            const initialCategory = (urlParams.get('category') || '').trim().toLowerCase();
            const initialBizId = (urlParams.get('biz') || '').trim();

            if (initialQuery && searchInput) {
                searchInput.value = initialQuery;
            }
            if (initialCategory) {
                document.querySelectorAll('#categoryFilterGroup input[type="checkbox"]').forEach(cb => {
                    if (cb.value.toLowerCase() === initialCategory) {
                        cb.checked = true;
                    }
                });
            }

            function parseImageList(biz) {
                const list = [];
                if (biz.image_url && !String(biz.image_url).startsWith('data:')) {
                    list.push(String(biz.image_url).trim());
                }
                if (biz.images) {
                    const raw = Array.isArray(biz.images) ? biz.images : String(biz.images).split(',');
                    raw.map(s => String(s).trim())
                        .filter(u => u && !u.startsWith('data:'))
                        .forEach(u => {
                            if (!list.includes(u)) list.push(u);
                        });
                }
                return list;
            }

            function renderModalSlideshow(images, businessName) {
                currentSlides = images;
                currentSlideIdx = 0;

                if (!currentSlides.length) {
                    slideshowWrap.style.display = 'none';
                    return;
                }

                slideshowWrap.style.display = 'block';
                slidesTrack.innerHTML = currentSlides
                    .map((src, idx) => `<div class="biz-modal-slide"><img src="${src}" alt="${businessName} photo ${idx + 1}"></div>`)
                    .join('');

                const hasMultiple = currentSlides.length > 1;
                slidePrevBtn.style.display = hasMultiple ? 'inline-flex' : 'none';
                slideNextBtn.style.display = hasMultiple ? 'inline-flex' : 'none';
                slideDotsWrap.style.display = hasMultiple ? 'flex' : 'none';

                slideDotsWrap.innerHTML = currentSlides
                    .map((_, idx) => `<button type="button" class="biz-slide-dot ${idx === 0 ? 'active' : ''}" data-dot="${idx}" aria-label="Slide ${idx + 1}"></button>`)
                    .join('');

                slideDotsWrap.querySelectorAll('.biz-slide-dot').forEach(dot => {
                    dot.addEventListener('click', () => goToSlide(Number(dot.dataset.dot)));
                });

                updateSlideshow();
            }

            function goToSlide(idx) {
                if (!currentSlides.length) return;
                currentSlideIdx = (idx + currentSlides.length) % currentSlides.length;
                updateSlideshow();
            }

            function updateSlideshow() {
                slidesTrack.style.transform = `translateX(-${currentSlideIdx * 100}%)`;
                slideDotsWrap.querySelectorAll('.biz-slide-dot').forEach((dot, idx) => {
                    dot.classList.toggle('active', idx === currentSlideIdx);
                });
            }

            slidePrevBtn.addEventListener('click', () => goToSlide(currentSlideIdx - 1));
            slideNextBtn.addEventListener('click', () => goToSlide(currentSlideIdx + 1));

            function wireCopyBtn(btnId, textVal) {
                const btn = document.getElementById(btnId);
                if (!btn) return;
                if (!textVal) {
                    btn.style.display = 'none';
                    return;
                }
                btn.style.display = 'inline-block';
                btn.textContent = 'Copy';
                btn.onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(textVal);
                        btn.textContent = 'Copied';
                        setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
                    } catch (_) {
                        btn.textContent = 'Copy';
                    }
                };
            }

            function openContactDetailsModal(data) {
                if (!data || !contactModal) return;

                document.getElementById('contactModalName').textContent = data.name || 'Campus Business';
                document.getElementById('contactModalLocation').textContent = data.location ? `📍 ${data.location}` : '';
                document.getElementById('contactModalDescription').textContent = data.description || '';
                document.getElementById('contactModalFindUs').textContent = data.findUs || data.location || 'On Campus / Ghana';

                const phoneEl = document.getElementById('contactModalPhone');
                const quickCallBtn = document.getElementById('quickCallBtn');
                const cleanPhone = (data.phone || '').trim();
                if (cleanPhone) {
                    const telHref = `tel:${cleanPhone.replace(/[^+\d]/g, '')}`;
                    phoneEl.textContent = cleanPhone;
                    phoneEl.href = telHref;
                    phoneEl.style.pointerEvents = 'auto';
                    quickCallBtn.href = telHref;
                    quickCallBtn.style.display = 'inline-flex';
                } else {
                    phoneEl.textContent = 'Not provided';
                    phoneEl.removeAttribute('href');
                    phoneEl.style.pointerEvents = 'none';
                    quickCallBtn.style.display = 'none';
                }

                const emailEl = document.getElementById('contactModalEmail');
                const quickEmailBtn = document.getElementById('quickEmailBtn');
                const cleanEmail = (data.email || '').trim();
                if (cleanEmail) {
                    const mailHref = `mailto:${cleanEmail}`;
                    emailEl.textContent = cleanEmail;
                    emailEl.href = mailHref;
                    emailEl.style.pointerEvents = 'auto';
                    quickEmailBtn.href = mailHref;
                    quickEmailBtn.style.display = 'inline-flex';
                } else {
                    emailEl.textContent = 'Not provided';
                    emailEl.removeAttribute('href');
                    emailEl.style.pointerEvents = 'none';
                    quickEmailBtn.style.display = 'none';
                }

                const websiteRow = document.getElementById('contactWebsiteRow');
                const websiteLink = document.getElementById('contactModalWebsite');
                const quickWebsiteBtn = document.getElementById('quickWebsiteBtn');
                const cleanSite = (data.website || '').trim();
                if (cleanSite) {
                    const hrefSite = /^https?:\/\//i.test(cleanSite) ? cleanSite : `https://${cleanSite}`;
                    websiteLink.href = hrefSite;
                    websiteLink.textContent = hrefSite;
                    websiteRow.style.display = 'flex';
                    quickWebsiteBtn.href = hrefSite;
                    quickWebsiteBtn.style.display = 'inline-flex';
                } else {
                    websiteRow.style.display = 'none';
                    quickWebsiteBtn.style.display = 'none';
                }

                wireCopyBtn('copyPhoneBtn', cleanPhone);
                wireCopyBtn('copyEmailBtn', cleanEmail);
                renderModalSlideshow(data.images || [], data.name || 'Business');

                if (typeof contactModal.showModal === 'function' && !contactModal.open) {
                    contactModal.showModal();
                }
            }

            function applySettings(cfg) {
                if (!cfg) return;
                const brandName = cfg.brandName || cfg.brand_name;
                const mainHeadline = cfg.mainHeadline || cfg.main_headline;
                const heroSubtext = cfg.heroSubtext || cfg.hero_subtext;
                const exploreNotice = cfg.exploreNotice || cfg.explore_notice;

                if (brandName) {
                    const siteLogo = document.getElementById('siteLogoText');
                    const footerLink = document.getElementById('footerBrandLink');
                    if (siteLogo) siteLogo.textContent = brandName;
                    if (footerLink) footerLink.textContent = brandName;
                }
                if (mainHeadline) {
                    const h1 = document.getElementById('exploreMainHeadline');
                    if (h1) h1.textContent = mainHeadline;
                }
                if (heroSubtext) {
                    const sub = document.getElementById('exploreHeroSubtext');
                    if (sub) sub.textContent = heroSubtext;
                }
                if (exploreNotice) {
                    const noticeEl = document.getElementById('explorePolicyText');
                    if (noticeEl) noticeEl.textContent = exploreNotice;
                }
            }

            function getFilteredAndSortedBusinesses() {
                const query = (searchInput ? searchInput.value : '').trim().toLowerCase();
                const selectedCategories = Array.from(document.querySelectorAll('#categoryFilterGroup input:checked'))
                    .map(i => i.value.trim().toLowerCase());
                const selectedLocations = Array.from(document.querySelectorAll('#locationFilterGroup input:checked'))
                    .map(i => i.value.trim().toLowerCase());
                const sortMode = sortSelect ? sortSelect.value : 'newest';

                let list = approvedBusinesses.filter(biz => {
                    if ((biz.status || '').toLowerCase() !== 'approved') return false;

                    const name = (biz.business_name || biz.name || '').toLowerCase();
                    const desc = (biz.description || '').toLowerCase();
                    const loc = (biz.location || '').toLowerCase();
                    const cat = (biz.category || '').toLowerCase();
                    const findUs = (biz.service_location || biz.where_to_find || biz.find_us || '').toLowerCase();

                    if (query) {
                        const haystack = `${name} ${desc} ${loc} ${cat} ${findUs}`;
                        if (!haystack.includes(query)) return false;
                    }

                    if (selectedCategories.length > 0) {
                        const matchesCat = selectedCategories.some(sc =>
                            cat.includes(sc) || sc.includes(cat) || name.includes(sc) || desc.includes(sc)
                        );
                        if (!matchesCat) return false;
                    }

                    if (selectedLocations.length > 0) {
                        const locHaystack = `${loc} ${findUs}`;
                        const matchesLoc = selectedLocations.some(sl => locHaystack.includes(sl));
                        if (!matchesLoc) return false;
                    }

                    return true;
                });

                if (sortMode === 'name-asc') {
                    list.sort((a, b) => (a.business_name || a.name || '').localeCompare(b.business_name || b.name || ''));
                } else if (sortMode === 'name-desc') {
                    list.sort((a, b) => (b.business_name || b.name || '').localeCompare(a.business_name || a.name || ''));
                }

                return list;
            }

            function toModalData(biz) {
                const bizName = biz.business_name || biz.name || 'Unnamed Business';
                const loc = biz.location || 'Elmina, Central Region';
                return {
                    name: bizName,
                    description: biz.description || '',
                    location: loc,
                    findUs: biz.service_location || biz.where_to_find || biz.find_us || loc,
                    phone: biz.phone || biz.tel || '',
                    email: biz.email || '',
                    images: parseImageList(biz),
                    website: biz.website || biz.website_url || ''
                };
            }

            function renderGrid() {
                if (!resultsGrid) return;
                const items = getFilteredAndSortedBusinesses();

                if (resultsCountLabel) {
                    resultsCountLabel.textContent = items.length === 1
                        ? 'Showing 1 approved business'
                        : `Showing ${items.length} approved businesses`;
                }

                if (!items.length) {
                    resultsGrid.innerHTML = `
                        <div class="empty-state-box">
                            <h3>No Approved Businesses Found</h3>
                            <p>Only businesses approved on the Admin page appear here. Try adjusting your search or filters, or submit a business for review.</p>
                            <a href="business.html" class="button button-primary">List Your Business</a>
                        </div>
                    `;
                    return;
                }

                resultsGrid.innerHTML = '';
                items.forEach(biz => {
                    const bizName = biz.business_name || biz.name || 'Unnamed Business';
                    const desc = biz.description || '';
                    const loc = biz.location || 'Elmina, Central Region';
                    const imgs = parseImageList(biz);

                    const article = document.createElement('article');
                    article.className = 'card explore-card';

                    const imgBox = document.createElement('div');
                    imgBox.className = 'explore-img-box';
                    if (imgs[0]) {
                        const img = document.createElement('img');
                        img.src = imgs[0];
                        img.alt = bizName;
                        imgBox.appendChild(img);
                    }

                    const content = document.createElement('div');
                    content.className = 'explore-card-content';

                    const h3 = document.createElement('h3');
                    h3.textContent = bizName;

                    const p = document.createElement('p');
                    p.textContent = desc.length > 70 ? desc.slice(0, 70) + '...' : desc;

                    const locSpan = document.createElement('span');
                    locSpan.className = 'location-tag';
                    locSpan.textContent = `📍 ${loc}`;

                    const contactBtn = document.createElement('button');
                    contactBtn.type = 'button';
                    contactBtn.className = 'button button-secondary card-btn contact-btn';
                    contactBtn.textContent = 'Contact';
                    contactBtn.addEventListener('click', () => {
                        selectedCardData = toModalData(biz);
                        if (connectPolicyModal && typeof connectPolicyModal.showModal === 'function') {
                            connectPolicyModal.showModal();
                        } else {
                            openContactDetailsModal(selectedCardData);
                        }
                    });

                    content.appendChild(h3);
                    content.appendChild(p);
                    content.appendChild(locSpan);
                    content.appendChild(contactBtn);

                    article.appendChild(imgBox);
                    article.appendChild(content);
                    resultsGrid.appendChild(article);
                });
            }

            function checkPendingHomepageNotice() {
                try {
                    const raw = sessionStorage.getItem(PENDING_NOTICE_KEY);
                    if (!raw) return;
                    const pending = JSON.parse(raw);
                    sessionStorage.removeItem(PENDING_NOTICE_KEY);

                    if (pending && pending.businessId) {
                        const match = approvedBusinesses.find(b => String(b.id) === String(pending.businessId));
                        if (match) {
                            selectedCardData = toModalData(match);
                            if (pending.notice) {
                                document.getElementById('explorePolicyText').textContent = pending.notice;
                            }
                            if (connectPolicyModal && typeof connectPolicyModal.showModal === 'function') {
                                connectPolicyModal.showModal();
                            }
                        }
                    }
                } catch (_) {}
            }

            async function syncSupabaseData() {
                try {
                    const cachedCfg = localStorage.getItem(CONFIG_KEY) || localStorage.getItem(LS_SETTINGS_KEY);
                    if (cachedCfg) applySettings(JSON.parse(cachedCfg));
                } catch (_) {}

                try {
                    const rawBiz = localStorage.getItem(LS_BUSINESSES_KEY);
                    const cachedBiz = rawBiz ? JSON.parse(rawBiz) : [];
                    if (Array.isArray(cachedBiz)) {
                        approvedBusinesses = cachedBiz.filter(b => (b.status || '').toLowerCase() === 'approved');
                        renderGrid();
                    }
                } catch (_) {}

                if (!sb) return;

                try {
                    const { data: settings } = await sb
                        .from('bisa_settings')
                        .select('*')
                        .eq('id', 1)
                        .maybeSingle();

                    if (settings) applySettings(settings);
                } catch (_) {}

                try {
                    let { data: approvedRows, error } = await sb
                        .from('bisa_businesses')
                        .select('*')
                        .eq('status', 'approved')
                        .order('created_at', { ascending: false });

                    if (error) {
                        const fallback = await sb
                            .from('businesses')
                            .select('*')
                            .eq('status', 'approved');
                        if (!fallback.error && Array.isArray(fallback.data)) {
                            approvedRows = fallback.data;
                            error = null;
                        }
                    }

                    if (!error && Array.isArray(approvedRows)) {
                        approvedBusinesses = approvedRows;
                        renderGrid();
                        checkPendingHomepageNotice();

                        if (initialBizId && !selectedCardData) {
                            const found = approvedBusinesses.find(b => String(b.id) === initialBizId);
                            if (found) {
                                selectedCardData = toModalData(found);
                                if (connectPolicyModal && typeof connectPolicyModal.showModal === 'function') {
                                    connectPolicyModal.showModal();
                                }
                            }
                        }
                    }
                } catch (_) {}
            }

            if (searchForm) {
                searchForm.addEventListener('submit', e => {
                    e.preventDefault();
                    renderGrid();
                });
            }

            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    renderGrid();
                });
            }

            if (sortSelect) {
                sortSelect.addEventListener('change', () => {
                    renderGrid();
                });
            }

            if (applyFiltersBtn) {
                applyFiltersBtn.addEventListener('click', () => {
                    renderGrid();
                });
            }

            document.querySelectorAll('#categoryFilterGroup input[type="checkbox"], #locationFilterGroup input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', () => {
                    renderGrid();
                });
            });

            if (clearFiltersBtn) {
                clearFiltersBtn.addEventListener('click', () => {
                    if (searchInput) searchInput.value = '';
                    if (sortSelect) sortSelect.value = 'newest';
                    document.querySelectorAll('#categoryFilterGroup input[type="checkbox"], #locationFilterGroup input[type="checkbox"]').forEach(cb => {
                        cb.checked = false;
                    });
                    renderGrid();
                });
            }

            if (cancelPolicyBtn) {
                cancelPolicyBtn.addEventListener('click', () => {
                    selectedCardData = null;
                    if (connectPolicyModal && connectPolicyModal.open) {
                        connectPolicyModal.close();
                    }
                });
            }

            if (agreePolicyBtn) {
                agreePolicyBtn.addEventListener('click', () => {
                    if (connectPolicyModal && connectPolicyModal.open) {
                        connectPolicyModal.close();
                    }
                    if (selectedCardData) {
                        openContactDetailsModal(selectedCardData);
                    }
                });
            }

            if (closeContactModalBtn) {
                closeContactModalBtn.addEventListener('click', () => {
                    if (contactModal && contactModal.open) {
                        contactModal.close();
                    }
                });
            }

            if (doneContactModalBtn) {
                doneContactModalBtn.addEventListener('click', () => {
                    if (contactModal && contactModal.open) {
                        contactModal.close();
                    }
                });
            }

            renderGrid();
            syncSupabaseData();
        })();
    </script>
